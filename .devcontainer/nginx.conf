server {
    listen 80;
    root /var/www/plrsys/public;
    index index.php;

    # API: everything under /api/ goes to the front controller, no exceptions
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_pass app:9000;
    }

    # Website front controller
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass app:9000;
    }

    # No other PHP file is ever directly executable (including /api.php)
    location ~ \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}