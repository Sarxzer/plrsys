services:
  app:
    build: .
    volumes:
      - ..:/var/www/innerspace:cached
    command: sh -c "php-fpm -D && sleep infinity"
    depends_on: [db]

  web:
    image: nginx:alpine
    ports: ["8000:80"]
    volumes:
      - ..:/var/www/innerspace:cached
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: innerspace-dev
      MYSQL_USER: innerspace-dev
      MYSQL_PASSWORD: secret
    ports: ["3306:3306"]
    volumes:
      - db-data:/var/lib/mysql
      - ../database.sql:/docker-entrypoint-initdb.d/database.sql:ro

volumes:
  db-data:
