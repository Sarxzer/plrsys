services:
  app:
    build: .
    volumes:
      - ..:/var/www/plrsys:cached
    command: sh -c "php-fpm -D && sleep infinity"
    depends_on: [db]

  web:
    image: nginx:alpine
    ports: ["8000:80"]
    volumes:
      - ..:/var/www/plrsys:cached
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]

  db:
    image: mysql:8
    ports: ["127.0.0.1:3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: plrsys-dev
      MYSQL_USER: plrsys-dev
      MYSQL_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  db-data:
